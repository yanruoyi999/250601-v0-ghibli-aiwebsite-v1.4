name: Wealth Video Full 142 Images

on:
  push:
    branches:
      - automation/wealth-video-v3-image-samples
    paths:
      - automation/wealth_video_v3_full/**
      - .github/workflows/wealth-video-full-142.yml

permissions:
  contents: read

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'diffusers==0.35.1' 'transformers>=4.45,<5' 'accelerate>=1.0' safetensors pillow

      - name: Render semantic image chunk
        env:
          HF_HUB_DISABLE_XET: '1'
        run: python automation/wealth_video_v3_full/render_full.py ${{ matrix.chunk }}

      - name: Verify chunk
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('automation/wealth_video_v3_full/out')
          files=sorted(root.glob('shot_*.jpg'))
          assert 28 <= len(files) <= 29, len(files)
          for p in files:
              im=Image.open(p)
              assert im.size==(1920,1080),(p,im.size)
          print('verified',len(files),files[0],files[-1])
          PY

      - name: Upload image chunk
        uses: actions/upload-artifact@v4
        with:
          name: wealth-video-v3-images-${{ matrix.chunk }}
          path: automation/wealth_video_v3_full/out/shot_*.jpg
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
