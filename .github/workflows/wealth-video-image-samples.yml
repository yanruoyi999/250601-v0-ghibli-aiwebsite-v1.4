name: Wealth Video Image Samples

on:
  push:
    branches:
      - automation/wealth-video-v3-image-samples
    paths:
      - automation/wealth_video_v3/**
      - .github/workflows/wealth-video-image-samples.yml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'diffusers==0.35.1' 'transformers>=4.45,<5' 'accelerate>=1.0' safetensors pillow

      - name: Render four style samples
        env:
          HF_HUB_DISABLE_XET: '1'
        run: python automation/wealth_video_v3/render_samples.py

      - name: Verify files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          out=Path('automation/wealth_video_v3/out')
          files=sorted(out.glob('shot_*_sample.png'))
          assert len(files)==4, files
          for p in files:
              im=Image.open(p)
              assert im.size==(1920,1080), (p,im.size)
          assert (out/'samples_contact.jpg').exists()
          print([str(p) for p in files])
          PY

      - name: Upload image samples
        uses: actions/upload-artifact@v4
        with:
          name: wealth-video-v3-image-samples
          path: automation/wealth_video_v3/out/*
          if-no-files-found: error
          retention-days: 7
