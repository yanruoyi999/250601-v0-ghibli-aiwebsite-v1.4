name: Wealth Video Painterly LoRA Samples

on:
  push:
    branches:
      - automation/wealth-video-v3-image-samples
    paths:
      - automation/wealth_video_v3_lora_quality/**
      - .github/workflows/wealth-video-lora-quality-samples.yml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'diffusers==0.35.1' 'transformers>=4.45,<5' 'accelerate>=1.0' safetensors pillow peft
      - name: Render painterly LoRA samples
        env:
          HF_HUB_DISABLE_XET: '1'
        run: python automation/wealth_video_v3_lora_quality/render_lora_samples.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          out=Path('automation/wealth_video_v3_lora_quality/out')
          files=sorted(out.glob('shot_*_lora.jpg'))
          assert len(files)==4,files
          assert all(Image.open(p).size==(1920,1080) for p in files)
          assert (out/'lora_quality_contact.jpg').exists()
          print(files)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wealth-video-v3-lora-quality-samples
          path: automation/wealth_video_v3_lora_quality/out/*
          if-no-files-found: error
          retention-days: 7
