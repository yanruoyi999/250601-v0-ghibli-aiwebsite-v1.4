name: Wealth Video SD Turbo Samples

on:
  push:
    branches:
      - automation/wealth-video-v3-image-samples
    paths:
      - automation/wealth_video_v3_sd_turbo/**
      - .github/workflows/wealth-video-sd-turbo-samples.yml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'diffusers==0.35.1' 'transformers>=4.45,<5' 'accelerate>=1.0' safetensors pillow
      - name: Render SD Turbo samples
        env:
          HF_HUB_DISABLE_XET: '1'
        run: python automation/wealth_video_v3_sd_turbo/test_sd_turbo.py
      - name: Verify outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          out=Path('automation/wealth_video_v3_sd_turbo/out')
          files=sorted(out.glob('shot_*_sd_turbo.jpg'))
          assert len(files)==6, files
          for p in files:
              assert Image.open(p).size==(1920,1080), p
          assert (out/'sd_turbo_contact.jpg').exists()
          print('verified',len(files))
          PY
      - name: Upload samples
        uses: actions/upload-artifact@v4
        with:
          name: wealth-video-sd-turbo-samples
          path: automation/wealth_video_v3_sd_turbo/out/*
          if-no-files-found: error
          retention-days: 7
